name: Deploy Static JSON to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'assets/catalog/**'
      - 'assets/adblock/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate & Stage Static JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate bundled catalog and ad-block JSON schemas
        run: npx jest src/__tests__/bundled-assets.test.ts

      - name: Stage static JSON site
        run: |
          mkdir -p _site/catalog _site/adblock
          cp assets/catalog/default-packs.json _site/catalog/default-packs.json
          cp assets/adblock/default-rules.json _site/adblock/default-rules.json
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
